<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Share Feedback | Dreampath Discover
    </title>
    
    <link
    rel="icon"
    type="image/png"
    href="images/kodaikanal complete/WhatsApp Image 2026-08-08 at 1.10.08 PM.jpeg"
  >

    <meta
        name="description"
        content="Tell us about your Dreampath journey and read stories from our travellers."
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body data-page="feedback">


    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <div id="site-header"></div>


    <main class="feedback-page">


        <!-- ========================================= -->
        <!-- FEEDBACK FORM -->
        <!-- ========================================= -->

        <section class="container narrow feedback-intro">

            <p class="eyebrow">
                SHARE YOUR STORY
            </p>

            <h1>
                How was your<br>
                <em>dreampath?</em>
            </h1>

            <p class="lead">
                Your words help us keep making journeys
                more meaningful.
            </p>


            <!-- ===================================== -->
            <!-- FEEDBACK FORM -->
            <!-- ===================================== -->

            <form
                class="form feedback-form"
                data-form="feedback"
            >


                <!-- NAME -->

                <label>

                    Your name

                    <input
                        name="name"
                        required
                        autocomplete="name"
                        placeholder="Enter your name"
                    >

                </label>


                <!-- EMAIL -->

                <label>

                    Email address

                    <input
                        type="email"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="Enter your email"
                    >

                </label>


                <!-- TRIP -->

                <label>

                    Which journey did you take?

                    <select name="trip">

                        <option value="Munnar in the mist">
                            Munnar in the mist
                        </option>

                        <option value="Kodaikanal slow escape">
                            Kodaikanal slow escape
                        </option>

                        <option value="Kolukumalai Twilight Tents">
                            Kolukumalai Twilight Tents
                        </option>

                        <option value="Kolukumalai – The Glass Castle">
                            Kolukumalai – The Glass Castle
                        </option>

                        <option value="Kolukumalai – The Logwood Cabin">
                            Kolukumalai – The Logwood Cabin
                        </option>

                        <option value="Vattavada Stay">
                            Vattavada Stay
                        </option>

                        <option value="Kanthaloor Stay">
                            Kanthaloor Stay
                        </option>

                        <option value="Custom journey">
                            Custom journey
                        </option>

                    </select>

                </label>


                <!-- RATING -->

                <fieldset>

                    <legend>
                        Your overall experience
                    </legend>


                    <div
                        class="rating"
                        aria-label="Choose your rating"
                    >

                        <input
                            id="s5"
                            type="radio"
                            name="rating"
                            value="5"
                            required
                        >

                        <label
                            for="s5"
                            title="5 stars"
                        >
                            ★
                        </label>


                        <input
                            id="s4"
                            type="radio"
                            name="rating"
                            value="4"
                        >

                        <label
                            for="s4"
                            title="4 stars"
                        >
                            ★
                        </label>


                        <input
                            id="s3"
                            type="radio"
                            name="rating"
                            value="3"
                        >

                        <label
                            for="s3"
                            title="3 stars"
                        >
                            ★
                        </label>


                        <input
                            id="s2"
                            type="radio"
                            name="rating"
                            value="2"
                        >

                        <label
                            for="s2"
                            title="2 stars"
                        >
                            ★
                        </label>


                        <input
                            id="s1"
                            type="radio"
                            name="rating"
                            value="1"
                        >

                        <label
                            for="s1"
                            title="1 star"
                        >
                            ★
                        </label>

                    </div>

                </fieldset>


                <!-- MESSAGE -->

                <label>

                    Your story

                    <textarea
                        name="message"
                        rows="6"
                        required
                        placeholder="What will you remember most?"
                    ></textarea>

                </label>


                <!-- SUBMIT -->

                <button
                    class="btn btn-primary"
                    type="submit"
                >

                    Share feedback

                    <span>
                        →
                    </span>

                </button>


                <!-- STATUS -->

                <p
                    class="form-status"
                    aria-live="polite"
                ></p>

            </form>

        </section>



        <!-- ========================================= -->
        <!-- TRAVELLER STORIES -->
        <!-- ========================================= -->

        <section class="section traveller-stories-section">


            <div class="container">


                <div class="section-head feedback-section-head">

                    <div>

                        <p class="eyebrow">
                            FROM OUR TRAVELLERS
                        </p>

                        <h2>
                            Stories from the<br>
                            <em>road.</em>
                        </h2>

                    </div>

                </div>


                <!-- ================================= -->
                <!-- FEEDBACK CARDS WILL APPEAR HERE -->
                <!-- ================================= -->

                <div
                    id="traveller-stories"
                    class="feedback-grid"
                >

                    <div class="feedback-loading">

                        <div class="feedback-loader"></div>

                        <p>
                            Loading traveller stories...
                        </p>

                    </div>

                </div>


            </div>

        </section>


    </main>


    <!-- ========================================= -->
    <!-- FOOTER -->
    <!-- ========================================= -->

    <div id="site-footer"></div>


    <!-- ========================================= -->
    <!-- BOOKING MODAL -->
    <!-- ========================================= -->

    <div id="booking-modal"></div>


    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->

    <script src="js/script.js"></script>

</body>

</html>
