<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Contact | Dreampath Discover
  </title>

  <link
    rel="icon"
    type="image/png"
    href="images/kodaikanal complete/WhatsApp Image 2026-08-08 at 1.10.08 PM.jpeg"
  >

  <meta
    name="description"
    content="Start planning your next escape with Dreampath Discover."
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body data-page="contact">


<div id="site-header"></div>


<main class="contact-page">


  <!-- =========================================
       CONTACT SECTION
       ========================================= -->

  <section class="container contact-layout">


    <!-- =======================================
         CONTACT INFORMATION
         ======================================= -->

    <div>

      <p class="eyebrow">
        GET IN TOUCH
      </p>


      <h1>
        Let’s start<br>
        somewhere <em>beautiful.</em>
      </h1>


      <p class="lead">
        Tell us where your mind is wandering.
        We’ll help turn it into a journey.
      </p>


      <div class="contact-details">


        <!-- PHONE -->

        <a href="tel:+919363540062">
          +91 93635 40062
        </a>


        <!-- EMAIL -->

        <a
          href="mailto:queries.dreampathdiscover@gmail.com"
        >
          queries.dreampathdiscover@gmail.com
        </a>


        <!-- WHATSAPP -->

        <a
          href="https://wa.me/919363540062"
          target="_blank"
          rel="noopener noreferrer"
        >
          WhatsApp us
        </a>


        <!-- INSTAGRAM -->

        <a
          href="https://www.instagram.com/dream.path.discover/"
          target="_blank"
          rel="noopener noreferrer"
        >
          @dream.path.discover
        </a>


        <!-- WORKING HOURS -->

        <p>
          Sunday–Saturday · 9:00 AM–6:00 PM IST
        </p>


      </div>

    </div>


    <!-- =======================================
         CONTACT FORM
         ======================================= -->

    <form
      class="form"
      data-form="contact"
    >


      <!-- NAME -->

      <div class="form-row">


        <label>

          First name

          <input
            required
            name="firstName"
            autocomplete="given-name"
          >

        </label>


        <label>

          Last name

          <input
            required
            name="lastName"
            autocomplete="family-name"
          >

        </label>


      </div>


      <!-- EMAIL -->

      <label>

        Email address

        <input
          required
          type="email"
          name="email"
          autocomplete="email"
        >

      </label>


      <!-- PHONE -->

      <label>

        Phone number

        <input
          required
          type="tel"
          name="phone"
          autocomplete="tel"
        >

      </label>


      <!-- INTEREST -->

      <label>

        What can we help with?

        <select name="interest">

          <option>
            Plan a journey
          </option>

          <option>
            Existing booking
          </option>

          <option>
            Booking / Cancellation enquiry
          </option>

          <option>
            Partnership enquiry
          </option>

          <option>
            Something else
          </option>

        </select>

      </label>


      <!-- MESSAGE -->

      <label>

        Tell us a little more

        <textarea
          name="message"
          rows="4"
          placeholder="Where would you like to go?"
        ></textarea>

      </label>


      <!-- SUBMIT -->

      <button
        class="btn btn-primary"
        type="submit"
      >

        Send message

        <span>
          →
        </span>

      </button>


      <!-- FORM STATUS -->

      <p
        class="form-status"
        aria-live="polite"
      ></p>


    </form>


  </section>


</main>


<div id="site-footer"></div>


<div id="booking-modal"></div>


<script src="js/script.js"></script>


</body>

</html>
