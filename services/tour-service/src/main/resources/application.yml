server:
  port: 8082
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
spring:
  application:
    name: tour-service
  datasource:
    url: jdbc:postgresql://postgres:5432/tourdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  upload:
    directory: ${TOUR_UPLOAD_DIRECTORY:./uploads}
  security:
    jwt-secret: ${JWT_SECRET:}
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
