server:
  port: 8083
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://postgres:5432/bookingdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  security:
    jwt-secret: ${JWT_SECRET:}
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
