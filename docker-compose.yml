name: dreampath-discover

services:
  postgres:
    image: postgres:17
    container_name: dreampath-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [dreampath]

  eureka-server:
    build: ./services/eureka-server
    container_name: dreampath-eureka
    ports: ["8761:8761"]
    networks: [dreampath]

  api-gateway:
    build: ./services/api-gateway
    container_name: dreampath-gateway
    depends_on: [eureka-server]
    ports: ["8080:8080"]
    networks: [dreampath]

  user-service:
    build: ./services/user-service
    depends_on: [postgres, eureka-server]
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    ports: ["8081:8081"]
    networks: [dreampath]

  tour-service:
    build: ./services/tour-service
    depends_on: [postgres, eureka-server]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TOUR_UPLOAD_DIRECTORY: /app/uploads
    ports: ["8082:8082"]
    volumes:
      - tour_uploads:/app/uploads
    networks: [dreampath]

  booking-service:
    build: ./services/booking-service
    depends_on: [postgres, eureka-server, tour-service]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports: ["8083:8083"]
    networks: [dreampath]

  payment-service:
    build: ./services/payment-service
    depends_on: [postgres, eureka-server]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports: ["8084:8084"]
    networks: [dreampath]

  notification-service:
    build: ./services/notification-service
    depends_on: [eureka-server]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports: ["8085:8085"]
    networks: [dreampath]

  frontend:
    image: nginx:alpine
    container_name: dreampath-frontend
    depends_on: [api-gateway]
    ports: ["4200:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [dreampath]

networks:
  dreampath:
    driver: bridge

volumes:
  postgres_data:
  tour_uploads:
